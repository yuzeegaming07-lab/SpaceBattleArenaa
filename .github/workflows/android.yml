name: Build Space Battle Arena APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'SpaceBattleArena3D_Prototype.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: |
          unzip SpaceBattleArena3D_Prototype.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle -p SpaceBattleArena3D assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Space-Battle-Arena-APK
          path: SpaceBattleArena3D/app/build/outputs/apk/debug/app-debug.apk
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spacebattlearena.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spacebattlearena.game'
        minSdk 23
        targetSdk 28

        versionCode 2
        versionName '0.2'
    }
}
